services:
  app:
    image: node:22
    working_dir: /app
    command: ["sh", "-ec", "corepack enable && CI=true pnpm install --frozen-lockfile && exec pnpm dev --hostname 0.0.0.0 --port 3000"]
    ports: ["3000:3000"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      - WATCHPACK_POLLING=true
    env_file:
      - /run/base44/app.env
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

volumes:
  node_modules:
